<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherBox - Secure String Encryption</title>

    <link rel="stylesheet" href="../css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lekton&family=Major+Mono+Display&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.0.0/bin/jsencrypt.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <h1><a href="/">CipherBox</a></h1>
            <ul>
                <li><a href="About.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <main>
            <form action="">
                <textarea id="input" cols="30" rows="10" placeholder="Enter your text here..."></textarea>

                <select id="algorithmSelector">
                    <option value="" hidden>Choose your algorithm</option>
                    <option value="AES">AES</option>
                    <option value="RSA">RSA</option>
                    <option value="MD5">MD5</option>
                    <option value="SHA-256">SHA-256</option>
                    <option value="DES">DES</option>
                </select>

                <button id="encryptButton" class="one" type="button">
                    <img src="../assets/lock.png" alt="Encrypt icon">
                    Encrypt
                </button>

                <button id="decryptButton" class="two" type="button">
                    <img src="../assets/Vector.png" alt="Decrypt icon">
                    Decrypt
                </button>
            </form>

            <div class="output">
                <div class="label">
                    <span>Encrypted or Decrypted text</span>
                    <button type="button" aria-label="Expand output">
                        <img src="../assets/maximize-2.png" alt="Expand output">
                    </button>
                </div>

                <p id="encryptedResult"></p>
                <p id="decryptedResult"></p>
            </div>
        </main>
    </div>

    <script src="js/app.js" defer></script>
</body>
</html>
